# Argo CD deploys this folder to your team's namespace. The GitHub Action
# sets the image below on every push to main; don't edit newName or newTag
# by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-meb
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - counter-deployment.yaml
  - counter-service.yaml
images:
  - name: app
    newName: ghcr.io/marikmartinez/meb-hackathon
    newTag: 9a66078
  - name: counter
    newName: ghcr.io/marikmartinez/meb-hackathon-counter
    newTag: 9a66078
