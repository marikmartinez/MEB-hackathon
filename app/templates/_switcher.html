{# Switch between the attendee and organizer views. Set `current` before including. #}

  <a href="{{ url_for('attendee') }}"{% if current == 'attendee' %} aria-current="page"{% endif %}>Attendee</a>
  <a href="{{ url_for('organizer') }}"{% if current == 'organizer' %} aria-current="page"{% endif %}>Organizer</a>
</nav>
